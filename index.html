<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I Wear Hats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#f3ebdd url(video/backdrop-poster.jpg) center/cover}
html,body{margin:0;height:100%}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.film{position:relative;width:min(960px,100%,calc((100svh - 170px) * 1.7778))}
#play{position:absolute;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none}
#play .c{display:grid;place-items:center;width:clamp(104px,16vw,150px);aspect-ratio:1;border-radius:50%;background:#000;transition:transform .2s}
#play svg{width:38%;height:38%;margin-left:7%;fill:#f3ebdd}
.film:hover #play .c{transform:scale(1.07)}
.go{position:fixed;right:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,32px);z-index:5;display:flex;align-items:center;gap:14px;font-family:Roboto,sans-serif;font-weight:700;font-size:20px;color:#000;text-decoration:none}
.go span{animation:in .7s .3s both ease-out,tick 2.6s 1.8s ease-in-out infinite}
.go img{display:block;width:clamp(110px,14vw,170px);height:auto;transition:translate .25s;animation:draw .9s .5s cubic-bezier(.6,0,.2,1) both,nudge 2.6s 1.8s ease-in-out infinite}
.go:hover img{translate:10px 0}
.go:hover span{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.go:focus-visible{outline:3px solid #000;outline-offset:6px}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes nudge{0%,60%,100%{transform:none}76%{transform:translateX(14px)}90%{transform:translateX(0)}}
@keyframes tick{0%,60%,100%{transform:none}76%{transform:translateX(5px)}90%{transform:none}}
@media (prefers-reduced-motion:reduce){#bg{display:none}.go span,.go img{animation:none}}
</style></head>
<body>
<video id="bg" src="video/backdrop.mp4" poster="video/backdrop-poster.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
<main>
  <div class="film">
    <div style="padding:56.25% 0 0 0;position:relative;"><iframe src="https://player.vimeo.com/video/1248134128?autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="I Wear Hats - A Short Poem - 2026"></iframe></div>
    <div id="play" aria-hidden="true"><span class="c"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2.5v19L21 12z"/></svg></span></div>
  </div>
</main>
<a class="go" href="caps.html"><span>Skip intro</span><img src="images/next_arrow.svg" alt=""></a>
<script src="https://player.vimeo.com/api/player.js"></script>
<script>
/* The big circle only decorates: the visitor's click lands on the Vimeo player itself,
   so the browser allows the sound. We just hide the circle once the film is playing. */
(function(){
  var p=new Vimeo.Player(document.querySelector('iframe')),c=document.getElementById('play');
  p.on('play',function(){c.hidden=true});
})();
</script>
</body></html>
